# 打 tag（v 开头，例如 v1.0.0 或 v1.0.0-beta.1）时：在 Windows 上从源码构建，生成免安装版 zip 和安装程序，
# 上传到 GitHub Releases（草稿，作者检查后手动发布）。构建全部由仓库里的 tools/build_app.py 完成，可以在本地复现：
#   python tools/build_app.py --version 1.0.0 --installer
# 目前还没有代码签名，用户第一次运行会看到 SmartScreen 提示（README 里有说明）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release、上传文件

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Inno Setup 6（生成安装程序用，开源）
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          (Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe").VersionInfo.ProductVersion

      - name: 测试
        run: dotnet test pcdoctor.sln -c Release

      - name: 从源码构建（免安装版 + 安装程序）
        # Iris 服务器地址取自仓库变量（Settings → Variables）；没设置时构建出的程序不联系服务器
        env:
          IRIS_FEEDBACK_URL: ${{ vars.IRIS_FEEDBACK_URL }}
          IRIS_LATEST_URL: ${{ vars.IRIS_LATEST_URL }}
        run: python tools/build_app.py --version "${{ github.ref_name }}" --installer --out dist

      - name: 保存未签名的构建产物
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: iris-${{ github.ref_name }}-unsigned
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      # ---------------------------------------------------------------------------------------------
      # 代码签名（SignPath Foundation 批准后启用；申请材料见 docs/signing-application.md，政策见 docs/CODE_SIGNING.md）
