      #   run: python tools/build_app.py --version "${{ github.ref_name }}" --from-exe signed-exe/Iris.exe --installer --out dist
      # - id: setup
      #   uses: actions/upload-artifact@v4
      #   with: { name: iris-setup-unsigned, path: dist/Iris-Setup-*.exe, if-no-files-found: error }
      # - name: 签安装程序
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: iris
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: installer
      #     github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
